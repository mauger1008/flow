services:
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    user: root
    volumes:
      - ./:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
